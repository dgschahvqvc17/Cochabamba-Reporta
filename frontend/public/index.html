<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Cochabamba Reporta - Sistema de Reporte y Seguimiento de Incidentes Urbanos"
    />
    <title>Cochabamba Reporta</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background-color: #063043;
        color-scheme: light;
      }

      #root {
        height: 100%;
      }

      /* Campos de texto: cursor en celeste institucional y sin borde de foco del navegador */
      input,
      textarea,
      select {
        caret-color: #16a3e0;
      }

      input:focus,
      textarea:focus,
      select:focus {
        outline: none !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
