<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Cochabamba Reporta - Sistema de Reporte y Seguimiento de Incidentes Urbanos"
    />
    <title>Cochabamba Reporta</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        /* Un solo scrollbar: el documento no debe desplazarse,
           solo los ScrollView internos de la app (web). */
        overflow: hidden;
        background-color: #063043;
        color-scheme: light;
      }

      #root {
        height: 100%;
        /* Flex container para que el View raíz (flex:1) llene la pantalla
           y la barra de navegación quede fija abajo sin scroll propio. */
        display: flex;
        min-width: 0;
        min-height: 0;
      }

      /* Campos de texto: cursor en celeste institucional y sin borde de foco del navegador */
      input,
      textarea,
      select {
        caret-color: #16a3e0;
      }

      input:focus,
      textarea:focus,
      select:focus {
        outline: none !important;
      }

      /* ── Barras de scroll (Dark Civic Tech) ─────────────────────── */
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }

      ::-webkit-scrollbar-track {
        background: transparent;
      }

      ::-webkit-scrollbar-thumb {
        border-radius: 999px;
        border: 3px solid transparent;
        background-clip: content-box;
        background-image: linear-gradient(180deg, #00d4ff, #16a3e0 55%, #0b4a6f);
      }

      ::-webkit-scrollbar-thumb:hover {
        background-image: linear-gradient(180deg, #67e6ff, #00d4ff 60%, #16a3e0);
        box-shadow: 0 0 8px rgba(0, 212, 255, 0.55);
      }

      ::-webkit-scrollbar-thumb:active {
        background-image: linear-gradient(180deg, #00d4ff, #0b4a6f);
      }

      ::-webkit-scrollbar-corner {
        background: transparent;
      }

      /* Firefox */
      * {
        scrollbar-width: thin;
        scrollbar-color: #16a3e0 rgba(3, 9, 18, 0.12);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
